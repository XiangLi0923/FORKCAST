<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORKCAST 食序 · 午餐决策演示</title>
  <link rel="stylesheet" href="/student-assets/student.css">
  <link rel="stylesheet" href="/student-assets/demo.css">
  <script type="module" src="/student-assets/demo.mjs"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><b>FORKCAST</b><span>食序</span></a>
    <nav aria-label="演示导航"><a href="/">学生端</a><a href="/ops">食堂运营端</a></nav>
  </header>
  <main class="demo">
    <section class="demo-intro">
      <p class="mode">赛后体验更新 · 模拟校园数据</p>
      <h1>今天中午，为什么推荐这份饭？</h1>
      <p>改预算、时间或想吃的菜，查看哪些餐次被排除、哪些进入排序。这里使用与学生端相同的推荐引擎，演示操作独立于学生与运营端。</p>
    </section>
    <section class="panel" aria-labelledby="experiment">
      <h2 id="experiment">试试三个午餐情境</h2>
      <div class="presets">
        <button type="button" class="button secondary" data-preset="duck">想吃烤鸭饭</button>
        <button type="button" class="button secondary" data-preset="budget">预算只有 ¥15</button>
        <button type="button" class="button secondary" data-preset="fast">只剩 20 分钟</button>
      </div>
      <form id="experiment-form">
        <label>预算上限（元）<input id="budget" type="number" min="0" max="1000" step="0.01" value="20" required></label>
        <label>用餐时间上限（分钟）<input id="minutes" type="number" min="0" max="200" value="45" required></label>
        <label>想吃的菜<select id="dish"><option value="">没有指定</option></select></label>
        <label>排序偏好<select id="profile"><option value="DEFAULT">综合推荐</option><option value="FAST">赶时间</option><option value="VALUE">控预算</option><option value="EXPLORE">探索新口味</option></select></label>
        <label class="demo-checkbox"><input id="sold-out" type="checkbox">模拟烤鸭饭售罄</label>
        <button class="button primary" type="submit">重新计算</button>
      </form>
    </section>
    <p id="demo-status" role="status">正在读取推荐结果…</p>
    <section aria-labelledby="result-title">
      <h2 id="result-title">推荐结果</h2>
      <p id="explanation"></p>
      <div id="results" class="demo-cards"></div>
    </section>
    <details class="panel" id="trace">
      <summary>查看全部候选及淘汰原因</summary>
      <div class="trace-table" tabindex="0" aria-label="候选餐次比较表">
        <table><thead><tr><th>餐次</th><th>价格</th><th>排队</th><th>总耗时</th><th>匹配分或未入选原因</th></tr></thead><tbody id="trace-body"></tbody></table>
      </div>
    </details>
    <section class="panel demo-next">
      <h2>看看食堂如何改变下一轮推荐</h2>
      <p>原比赛场景可在学生端表达并授权需求，在运营端审批备餐，然后从学生端查看下一供餐窗的变化。</p>
      <a class="button secondary" href="/">原闭环 · 学生端</a>
      <a class="button secondary" href="/ops">原闭环 · 运营端</a>
    </section>
  </main>
</body>
</html>
